<style>
:root{
  --g:#073334;
  --o:#C9A227;
  --darkgold:#80600C;
  --gband:rgba(7,51,52,0.12);
}

*{box-sizing:border-box}

html{
  background:#f4f1e8;
  color-scheme:light;
}

body{
  margin:0;
  font-family:'Quicksand',system-ui,sans-serif;
  color:#1a1a1a;
  background:#f4f1e8;
}

header{
  background:var(--g);
  color:#fff;
  padding:18px 16px;
  text-align:center;
  border-bottom:1px solid var(--g);
}

header b{
  color:var(--o);
  letter-spacing:.2em;
  font-size:13px;
}

header h1{
  margin:4px 0 0;
  font-weight:500;
  font-size:26px;
  color:#fff;
}

main{
  max-width:640px;
  margin:0 auto;
  padding:20px 14px;
}

label{
  display:block;
  font-weight:700;
  color:var(--g);
  margin:12px 0 4px;
  font-size:14px;
}

input,select,textarea{
  width:100%;
  font:inherit;
  padding:12px;
  border:1px solid #cfc9b6;
  border-radius:10px;
  background:#fff;
  color:#1a1a1a;
}

button{
  font:inherit;
  font-weight:700;
  border:0;
  border-radius:12px;
  padding:14px 16px;
  cursor:pointer;
}

.main{
  background:var(--g);
  color:#fff;
  border:1px solid var(--g);
  width:100%;
  margin-top:14px;
  font-size:17px;
}

.main:hover{
  background:rgba(7,51,52,.9);
}

.alt{
  background:var(--o);
  color:#1a1a1a;
}

.row{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.row button{flex:1}

#status{
  margin:12px 0;
  color:#444;
  font-size:14px;
  white-space:pre-wrap;
}

#status.err{color:#a02020}

details{
  margin-top:16px;
  background:#fff;
  border-radius:10px;
  padding:10px 12px;
  border:1px solid #cfc9b6;
}

summary{
  font-weight:700;
  color:var(--g);
}

.tab-container{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.tab-btn{
  flex:1;
  background:#fff;
  border:2px solid var(--g);
  color:var(--g);
  border-radius:10px;
  padding:12px;
  cursor:pointer;
  transition:all .2s;
  font-size:15px;
}

.tab-btn.active{
  background:var(--g);
  color:#fff;
}

.menu-section{display:none}
.menu-section.active{display:block}

.quick-links{
  margin:10px 0;
  background:#fff;
  border-radius:10px;
  padding:12px;
  border:1px solid #cfc9b6;
}

.quick-links p{
  margin:0 0 6px;
  font-size:12px;
  font-weight:700;
  color:var(--g);
}

.quick-links a{
  display:inline-block;
  margin-right:15px;
  color:var(--g);
  text-decoration:none;
  font-size:13px;
  font-weight:700;
  border-bottom:1px solid var(--o);
  padding-bottom:1px;
}

.quick-links a:hover{color:var(--o)}

/* FOGLIO MENU */

#sheet{
  display:none;
  flex-direction:column;
  min-height:720px;
  background:#fff;
  margin-top:16px;
  border-radius:6px;
  box-shadow:0 2px 10px #0002;
  overflow:hidden;
  width:100%;
  max-width:500px;
  margin-left:auto;
  margin-right:auto;
}

.topband{
  background:var(--gband);
  padding:14px 0;
  text-align:center;
  width:100%;
  flex-shrink:0;
}

.topband img{
  width:45%;
  height:auto;
  display:block;
  margin:0 auto;
  filter: none !important;
}

.botband{
  background:var(--gband);
  margin-top:auto;
  padding-top:12px;
  width:100%;
  flex-shrink:0;
}

.botband img{
  width:60%;
  height:auto;
  display:block;
  margin:0 auto;
  filter:brightness(0) saturate(100%)
         invert(35%) sepia(76%) saturate(600%)
         hue-rotate(8deg) brightness(85%) contrast(95%);
}

/* EMPFEHLUNGSKARTE: niente banda colorata e niente casetta in basso, solo la bandiera */

#sheet.empf .botband{
  background:transparent !important;
  padding-top:0 !important;
}

#sheet.empf .botband img{
  display:none !important;
}

.flag{
  display:flex;
  height:7px;
  width:100%;
}

.flag i{flex:1}
.flag i:nth-child(1){background:#295E28}
.flag i:nth-child(2){background:#ECE6D5}
.flag i:nth-child(3){background:#B60D08}

/* AREA TESTO */

.inner{
  padding:19px 30px 10px;
  flex:1;
  min-height:0;
}

.title{
  text-align:center;
  color:var(--g);
  font-size:32px;
  font-weight:400;
  font-family:'Quicksand',sans-serif;
  line-height:1.15;
  margin:0 0 4px;
}

.sub{
  text-align:center;
  color:var(--o);
  letter-spacing:.3em;
  font-size:11px;
  font-weight:700;
  font-family:'Quicksand',sans-serif;
  padding-bottom:11px;
  border-bottom:1px solid var(--o);
  margin-bottom:12px;
}

.day{
  text-align:center;
  color:var(--g);
  font-size:23px;
  font-weight:400;
  font-family:'Quicksand',sans-serif;
  margin:5px 0 7px;
}

/* PIATTI */

.dish-wrapper{
  padding:5px 0;
  border-bottom:1px solid #e8e8e8;
}

.dish-wrapper:last-of-type{
  border-bottom:none;
}

.dish{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  padding:2px 0;
  font-size:14px;
  line-height:1.4;
  font-family:'Quicksand',sans-serif;
}

.dish .n{
  outline:none;
  text-align:left;
  font-weight:400;
  font-family:'Quicksand',sans-serif;
  flex:1;
  min-width:0;
  overflow-wrap:anywhere;
}

.dish .p{
  font-weight:700;
  color:var(--g);
  outline:none;
  white-space:nowrap;
  text-align:right;
  font-family:'Quicksand',sans-serif;
  flex-shrink:0;
}

.desc{
  font-size:10.5px;
  color:#666;
  font-style:italic;
  margin-top:2px;
  text-align:left;
  outline:none;
  font-family:'Quicksand',sans-serif;
  line-height:1.35;
}

/* CATEGORIE */

.category-title{
  color:var(--darkgold);
  font-size:15px;
  font-weight:700;
  margin:14px 0 6px;
  border-bottom:1px dashed var(--o);
  padding-bottom:4px;
  text-transform:uppercase;
  font-family:'Quicksand',sans-serif;
  text-align:center;
  line-height:1.2;
}

.hint{
  font-size:12px;
  color:#777;
  text-align:center;
  margin-top:8px;
}

/* PDF Empfehlungskarte: layout compatto per stare in una pagina A4 */

.empf-pdf-compact .topband{padding:8px 0 !important}
.empf-pdf-compact .topband img{width:32% !important}
.empf-pdf-compact .inner{padding:48px 22px 48px !important} /* 48px = 2 cm su foglio A4 */
.empf-pdf-compact .title{font-size:24px !important;margin-bottom:2px !important}
.empf-pdf-compact .sub{padding-bottom:6px !important;margin-bottom:6px !important}
.empf-pdf-compact .category-title{font-size:13px !important;margin:6px 0 3px 0 !important}
.empf-pdf-compact .dish-wrapper{padding:3px 0 !important}
.empf-pdf-compact .dish,
.empf-pdf-compact .dish .n,
.empf-pdf-compact .dish .p{font-size:12px !important}
.empf-pdf-compact .desc{font-size:9px !important;margin-top:1px !important}

/* STAMPA A4 */

@media print{

  @page{
    size:A4;
    margin:0;
  }

  html,body{
    margin:0;
    padding:0;
    background:#fff;
  }

  body{
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

  header,
  main>*:not(#sheet),
  .hint{
    display:none!important;
  }

  main{
    padding:0;
    max-width:none;
    margin:0;
  }

  #sheet{
    display:flex!important;
    flex-direction:column;
    width:210mm;
    height:297mm;
    min-height:297mm;
    max-width:none;
    box-shadow:none;
    margin:0;
    border-radius:0;
    overflow:hidden;
    page-break-after:avoid;
    break-after:avoid;
  }

  .topband{
    height:45mm;
    min-height:45mm;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--gband)!important;
  }

  .topband img{
    height:35mm;
    width:auto;
  }

  .inner{
    flex:1;
    min-height:0;
    padding:5mm 15mm 2mm;
  }

  .botband{
    margin-top:auto;
    height:auto;
    padding-top:0;
    background:var(--gband)!important;
    flex-shrink:0;
  }

  #sheet.empf .botband{
    background:transparent!important;
  }

  .flag{
    height:2.8mm;
    flex:none;
  }
}
</style>

</main>

<script>
const DAYS = [
  "Montag","Dienstag","Mittwoch","Donnerstag",
  "Freitag","Samstag","Sonntag"
];

const PRICE_REGEX = /^\s*(?:€\s*)?(\d{1,3}(?:[.,]\d{1,2})?)\s*(?:€|EUR)?\s*$/;

const CATEGORIES = [
  "vorspeisen",
  "hauptgerichte",
  "getränke",
  "desserts"
];

let selectedMenuType = "mittag";

/* PARSER MITTAGSTISCH */

function parseMittagstisch(text, day){

  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const daysLow = DAYS.map(d => d.toLowerCase());

  for(let i=0;i<lines.length;i++){

    if(lines[i].toLowerCase() !== day.toLowerCase()) continue;

    const dishes = [];
    let buf = [];

    for(let j=i+1;j<lines.length;j++){

      const x = lines[j];

      if(daysLow.includes(x.toLowerCase())) break;

      const m = x.match(PRICE_REGEX);

      if(m){

        if(buf.length){
          dishes.push([buf.slice(-2).join(" "),m[1]]);
        }

        buf = [];

      }else{

        buf.push(x);

        if(dishes.length && buf.length > 3) break;
      }
    }

    if(dishes.length) return dishes;
  }

  return [];
}

/* ESTRAZIONE PREZZI */

function extractCleanPrice(line){

  const cleaned = line.replace(/€/g,"").replace(/EUR/g,"").trim();

  const match = cleaned.match(/^(\d{1,3}[.,]\d{2})$|^(\d{1,3})$/);

  return match ? (match[1] || match[2]) : null;
}

/* PARSER EMPFEHLUNGSKARTE */

function parseEmpfehlungskarte(text){

  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const dishes = [];

  let currentCategory = "";

  const daysLow = DAYS.map(d => d.toLowerCase());

  let mittagStartIdx = -1;
  let mittagEndIdx = -1;

  for(let i=0;i<lines.length;i++){

    const lineLow = lines[i].toLowerCase();

    if(daysLow.includes(lineLow)){

      if(mittagStartIdx === -1){
        mittagStartIdx = i;
      }

      mittagEndIdx = i;
    }
  }

  let rangeToSkipStart = -1;
  let rangeToSkipEnd = -1;

  if(mittagStartIdx !== -1){

    rangeToSkipStart = mittagStartIdx;
    rangeToSkipEnd = lines.length;

    for(let k=mittagEndIdx+1;k<lines.length;k++){

      if(CATEGORIES.includes(lines[k].toLowerCase())){
        rangeToSkipEnd = k;
        break;
      }
    }
  }

  for(let i=0;i<lines.length;i++){

    if(i>=rangeToSkipStart && i<rangeToSkipEnd){
      continue;
    }

    const line = lines[i];
    const lineLow = line.toLowerCase();

    if(CATEGORIES.includes(lineLow)){
      currentCategory = line;
      continue;
    }

    const priceVal = extractCleanPrice(line);

    if(priceVal){

      let name = "";
      let desc = "";

      if(i-1>=0){

        name = lines[i-1];

        if(
          CATEGORIES.includes(name.toLowerCase()) ||
          daysLow.includes(name.toLowerCase())
        ){
          name = "Specialità dello Chef";
        }
      }

      if(i+1<lines.length){

        const nextLine = lines[i+1];

        if(
          !extractCleanPrice(nextLine) &&
          !CATEGORIES.includes(nextLine.toLowerCase()) &&
          !daysLow.includes(nextLine.toLowerCase())
        ){
          desc = nextLine;
        }
      }

      dishes.push({
        category:currentCategory || "Empfehlungen",
        name:name,
        price:priceVal,
        desc:desc
      });
    }
  }

  return dishes;
}

/* INIZIALIZZAZIONE */

if(typeof document !== "undefined"){

  const $ = id => document.getElementById(id);

  const selectDay = $("dayMittag");

  selectDay.innerHTML = "";

  const todayDe = new Date().toLocaleDateString(
    "de-DE",
    {
      weekday:"long",
      timeZone:"Europe/Berlin"
    }
  );

  DAYS.forEach(d => {

    const o = document.createElement("option");

    o.value = d;
    o.textContent = d;

    selectDay.appendChild(o);
  });

  selectDay.value = DAYS.slice(0,5).includes(todayDe)
    ? todayDe
    : "Montag";

  const status = (t,err) => {

    $("status").textContent = t;
    $("status").className = err ? "err" : "";
  };

  /* CAMBIO TAB */

  $("tabMittag").onclick = () => {

    selectedMenuType = "mittag";

    $("tabMittag").classList.add("active");
    $("tabEmpf").classList.remove("active");

    $("sectionMittag").classList.add("active");
    $("sectionEmpf").classList.remove("active");

    $("mainHeaderTitle").textContent = "Mittagstisch";
    $("sheetTitle").textContent = "Mittagstisch";
    $("sheetSubtitle").textContent = "TAGESGERICHTE";

    status("");
  };

  $("tabEmpf").onclick = () => {

    selectedMenuType = "empfehlung";

    $("tabEmpf").classList.add("active");
    $("tabMittag").classList.remove("active");

    $("sectionEmpf").classList.add("active");
    $("sectionMittag").classList.remove("active");

    $("mainHeaderTitle").textContent = "Empfehlungskarte";
    $("sheetTitle").textContent = "Empfehlungskarte";
    $("sheetSubtitle").textContent = "EMPFEHLUNGEN";

    status("");
  };

  /* VISUALIZZAZIONE MITTAGSTISCH */

  function renderMittag(day,dishes){

    // Mittagstisch: banda e casetta restano
    $("sheet").classList.remove("empf");

    $("sheetDay").style.display = "block";
    $("sheetDay").textContent = day;

    const inner = $("sheetInner");
    inner.style.transform = "none";
    inner.style.transformOrigin = "top center";

    $("sheetBotBand").style.background = "";
    $("sheetBotImg").style.display = "block";

    $("dishes").innerHTML = "";

    dishes.forEach(([n,p]) => {

      const row = document.createElement("div");
      row.className = "dish";

      row.innerHTML =
        '<span class="n" contenteditable="true"></span>' +
        '<span class="p" contenteditable="true"></span>';

      row.querySelector(".n").textContent = n;
      row.querySelector(".p").textContent = p + " €";

      $("dishes").appendChild(row);
    });

    $("sheet").style.display = "flex";
    $("actions").style.display = "flex";
    $("hint").style.display = "block";

    status("Generato: " + dishes.length + " piatti per " + day + ".");

    $("sheet").scrollIntoView({behavior:"smooth"});
  }

  /* VISUALIZZAZIONE EMPFEHLUNGSKARTE */

  function renderEmpfehlung(dishes){

    // Empfehlungskarte: niente banda colorata e niente casetta, solo la bandiera
    $("sheet").classList.add("empf");

    $("sheetDay").style.display = "none";

    $("sheetBotBand").style.background = "transparent";
    $("sheetBotImg").style.display = "none";

    const container = $("dishes");

    container.innerHTML = "";

    let lastCat = "";

    dishes.forEach(dish => {

      if(
        dish.category &&
        dish.category !== lastCat &&
        dish.category.toLowerCase() !== "empfehlungen"
      ){

        const catHeader = document.createElement("div");

        catHeader.className = "category-title";
        catHeader.textContent = dish.category;

        container.appendChild(catHeader);

        lastCat = dish.category;
      }

      const wrapper = document.createElement("div");

      wrapper.className = "dish-wrapper";

      const descHtml = dish.desc
        ? `<div class="desc" contenteditable="true">${dish.desc}</div>`
        : "";

      wrapper.innerHTML = `
        <div class="dish">
          <span class="n" contenteditable="true">${dish.name}</span>
          <span class="p" contenteditable="true">${dish.price} €</span>
        </div>
        ${descHtml}
      `;

      container.appendChild(wrapper);
    });

    $("sheet").style.display = "flex";
    $("actions").style.display = "flex";
    $("hint").style.display = "block";

    const inner = $("sheetInner");
    inner.style.transform = "none";

    requestAnimationFrame(() => {
      const availableHeight = 580;
      const currentHeight = inner.scrollHeight;

      if (currentHeight > availableHeight) {
        const scaleFactor = Math.max(0.6, availableHeight / currentHeight);
        inner.style.transform = `scale(${scaleFactor})`;
        inner.style.transformOrigin = "top center";
      } else {
        inner.style.transform = "none";
      }
    });

    status("Generato: " + dishes.length + " elementi in una singola pagina.");

    $("sheet").scrollIntoView({behavior:"smooth"});
  }

  /* LETTURA SITO MITTAGSTISCH */

  $("goMittag").onclick = async () => {

    const day = $("dayMittag").value;

    status("Lettura dei dati Mittagstisch...");

    try{

      const targetUrl = $("urlMittag").value.trim();

      const r = await fetch("/api/menu?url=" + encodeURIComponent(targetUrl));
      const j = await r.json();

      if(j.error) throw new Error(j.error);

      const dishes = parseMittagstisch(j.text,day);

      if(!dishes.length){

        status("Nessun piatto per " + day + " trovato sul sito.",true);
        return;
      }

      renderMittag(day,dishes);

    }catch(e){

      status("Errore: " + e.message,true);
    }
  };

  /* LETTURA SITO EMPFEHLUNGSKARTE */

  $("goEmpf").onclick = async () => {

    status("Lettura dei dati Empfehlungskarte...");

    try{

      const targetUrl = $("urlEmpf").value.trim();

      const r = await fetch("/api/menu?url=" + encodeURIComponent(targetUrl));
      const j = await r.json();

      if(j.error) throw new Error(j.error);

      const dishes = parseEmpfehlungskarte(j.text);

      if(!dishes.length){

        status("Nessun piatto trovato.",true);
        return;
      }

      renderEmpfehlung(dishes);

    }catch(e){

      status("Errore: " + e.message,true);
    }
  };

  /* TESTO INCOLLATO MANUALMENTE */

  $("usePaste").onclick = () => {

    const pasteContent = $("paste").value;

    if(selectedMenuType === "mittag"){

      const day = $("dayMittag").value;
      const dishes = parseMittagstisch(pasteContent,day);

      if(!dishes.length){

        status("Nessun piatto Mittagstisch nel testo.",true);
        return;
      }

      renderMittag(day,dishes);

    }else{

      const dishes = parseEmpfehlungskarte(pasteContent);

      if(!dishes.length){

        status("Nessun piatto speciale nel testo.",true);
        return;
      }

      renderEmpfehlung(dishes);
    }
  };

  /* SALVATAGGIO FILE */

  async function saveFile(blob,name){

    const file = new File(
      [blob],
      name,
      {type:blob.type}
    );

    if(
      navigator.canShare &&
      navigator.canShare({files:[file]})
    ){

      try{

        await navigator.share({
          files:[file],
          title:name
        });

        return;

      }catch(e){

        if(e.name === "AbortError") return;
      }
    }

    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);
    a.download = name;

    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  const stamp = () => new Date().toISOString().slice(0,10);

  /* ESPORTAZIONE FOTO */

  $("photo").onclick = async () => {

    status("Generazione dell'immagine...");

    try{

      await document.fonts.ready;

      const canvas = await html2canvas($("sheet"),{
        useCORS:true,
        backgroundColor:"#ffffff",
        scale:2
      });

      canvas.toBlob(async blob => {

        const titleName = selectedMenuType === "mittag"
          ? "Mittagstisch"
          : "Empfehlungskarte";

        await saveFile(
          blob,
          titleName + "_" + stamp() + ".png"
        );

        status("Immagine salvata!");

      },"image/png");

    }catch(e){

      status("Errore: " + e.message,true);
    }
  };

  /* ESPORTAZIONE PDF */

  $("pdf").onclick = async () => {

    status("Generazione del PDF...");

    try{

      await document.fonts.ready;

      const {PDFDocument} = PDFLib;
      const pdfDoc = await PDFDocument.create();

      const a4Width = 595.28;
      const a4Height = 841.89;

      const SHEET_W = 500;
      const SHEET_H = Math.round(SHEET_W * a4Height / a4Width);

      const isMittag = selectedMenuType === "mittag";
      const titleText = isMittag ? "Mittagstisch" : "Empfehlungskarte";
      const subtitleText = isMittag ? "TAGESGERICHTE" : "EMPFEHLUNGEN";
      const dayText = $("sheetDay").textContent;

      const elements = Array.from($("dishes").children);

      // Empfehlungskarte: sempre una sola pagina. Mittagstisch: divide solo se troppo lungo
      let pagesContent = [[]];

      if(isMittag){

        let idx = 0;
        let h = 0;

        elements.forEach(el => {

          const elH = el.offsetHeight || 30;

          if(h + elH > 620 && pagesContent[idx].length > 0){
            idx++;
            pagesContent[idx] = [];
            h = 0;
          }

          pagesContent[idx].push(el);
          h += elH;
        });

      }else{
        pagesContent = [elements];
      }

      for(let p=0;p<pagesContent.length;p++){

        const tempContainer = document.createElement("div");
        tempContainer.style.position = "absolute";
        tempContainer.style.top = "-9999px";
        tempContainer.style.left = "-9999px";
        tempContainer.style.width = SHEET_W + "px";
        document.body.appendChild(tempContainer);

        const cloneSheet = $("sheet").cloneNode(true);
        cloneSheet.style.display = "flex";
        cloneSheet.style.flexDirection = "column";
        cloneSheet.style.width = SHEET_W + "px";
        cloneSheet.style.maxWidth = "none";
        cloneSheet.style.minHeight = SHEET_H + "px";
        cloneSheet.style.height = "auto";
        cloneSheet.style.margin = "0";
        cloneSheet.style.borderRadius = "0";
        cloneSheet.style.boxShadow = "none";

        if(!isMittag){

          cloneSheet.classList.add("empf");
          cloneSheet.classList.add("empf-pdf-compact");

          // via la casetta: resta solo la bandiera
          const botImg = cloneSheet.querySelector("#sheetBotImg");
          if(botImg) botImg.remove();
        }

        tempContainer.appendChild(cloneSheet);

        const innerClone = cloneSheet.querySelector("#sheetInner");
        innerClone.style.transform = "none";

        const dishesDiv = cloneSheet.querySelector("#dishes");
        dishesDiv.innerHTML = "";

        cloneSheet.querySelector("#sheetTitle").textContent = titleText;
        cloneSheet.querySelector("#sheetSubtitle").textContent = subtitleText;

        const dayEl = cloneSheet.querySelector("#sheetDay");

        if(isMittag){
          dayEl.style.display = "block";
          dayEl.textContent = dayText;
        }else{
          dayEl.style.display = "none";
        }

        pagesContent[p].forEach(el => {
          dishesDiv.appendChild(el.cloneNode(true));
        });

        // Racchiudo il contenuto: così il margine di sicurezza non viene mai ridotto
        const wrap = document.createElement("div");
        while(innerClone.firstChild) wrap.appendChild(innerClone.firstChild);
        innerClone.appendChild(wrap);

        await new Promise(resolve => requestAnimationFrame(resolve));

        if(!isMittag){

          // EMPFEHLUNGSKARTE: il contenuto occupa tutto lo spazio tra la banda del logo
          // e la bandiera, in larghezza e in altezza. Si ingrandisce se c'è spazio,
          // si riduce solo se non ci sta. I 2 cm di margine restano fissi.

          const topEl = cloneSheet.querySelector(".topband");
          const botEl = cloneSheet.querySelector("#sheetBotBand");
          const cs = getComputedStyle(innerClone);

          const avail = SHEET_H
            - topEl.offsetHeight
            - botEl.offsetHeight
            - parseFloat(cs.paddingTop)
            - parseFloat(cs.paddingBottom);

          wrap.style.height = "auto";

          // altezza visiva del contenuto con fattore di scala sc (larghezza sempre piena)
          const visualHeight = sc => {
            wrap.style.width = (100 / sc) + "%";
            return wrap.offsetHeight * sc;
          };

          const MIN_SC = 0.4;
          const MAX_SC = 2.2;

          let best = MIN_SC;

          if(visualHeight(MAX_SC) <= avail){

            best = MAX_SC;

          }else{

            let lo = MIN_SC;
            let hi = MAX_SC;

            for(let k=0;k<14;k++){

              const mid = (lo + hi) / 2;

              if(visualHeight(mid) <= avail){
                best = mid;
                lo = mid;
              }else{
                hi = mid;
              }
            }
          }

          wrap.style.width = (100 / best) + "%";
          wrap.style.height = avail + "px";
          wrap.style.transformOrigin = "top left";
          wrap.style.transform = "scale(" + best + ")";

        }else{

          // MITTAGSTISCH: solo riduzione se il foglio è più alto di un A4
          const over = cloneSheet.offsetHeight - SHEET_H;

          if(over > 0){

            const wh = wrap.offsetHeight;
            const target = wh - over;

            if(target > 50){

              const sc = target / wh;

              wrap.style.height = target + "px";
              wrap.style.width = (100 / sc) + "%";
              wrap.style.transformOrigin = "top left";
              wrap.style.transform = "scale(" + sc + ")";
            }
          }
        }

        await new Promise(resolve => requestAnimationFrame(resolve));

        const canvas = await html2canvas(cloneSheet, {
          useCORS: true,
          backgroundColor: "#ffffff",
          scale: 3
        });

        tempContainer.remove();

        const imgData = canvas.toDataURL("image/png");
        const page = pdfDoc.addPage([a4Width, a4Height]);
        const pngImage = await pdfDoc.embedPng(imgData);

        // Riempie tutta la larghezza; se per caso è più alto, si adatta in altezza
        let finalWidth = a4Width;
        let finalHeight = canvas.height * finalWidth / canvas.width;

        if(finalHeight > a4Height){
          finalHeight = a4Height;
          finalWidth = canvas.width * finalHeight / canvas.height;
        }

        page.drawImage(pngImage, {
          x: (a4Width - finalWidth) / 2,
          y: (a4Height - finalHeight) / 2,
          width: finalWidth,
          height: finalHeight
        });
      }

      const pdfBytes = await pdfDoc.save();

      await saveFile(
        new Blob([pdfBytes], {type: "application/pdf"}),
        titleText + "_" + stamp() + ".pdf"
      );

      status("PDF salvato con successo!");

    }catch(e){

      status("Errore: " + e.message, true);
    }
  };

}
</script>
