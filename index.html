<style>
  :root{--g:#073334;--o:#C9A227}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Quicksand',system-ui,sans-serif;color:#1a1a1a;background:#f4f1e8}
  header{background:var(--g);color:#fff;padding:18px 16px;text-align:center}
  header b{color:var(--o);letter-spacing:.2em;font-size:13px}
  header h1{margin:4px 0 0;font-weight:500;font-size:26px}
  main{max-width:640px;margin:0 auto;padding:14px}
  label{display:block;font-weight:700;color:var(--g);margin:12px 0 4px;font-size:14px}
  input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #cfc9b6;border-radius:10px;background:#fff;color:#1a1a1a}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 16px;cursor:pointer}
  .main{background:var(--g);color:#fff;width:100%;margin-top:14px;font-size:17px}
  .alt{background:var(--o);color:#1a1a1a}
  .row{display:flex;gap:10px;margin-top:12px}.row button{flex:1}
  #status{margin:12px 0;color:#444;font-size:14px;white-space:pre-wrap}
  #status.err{color:#a02020}
  details{margin-top:16px;background:#fff;border-radius:10px;padding:10px 12px;border:1px solid #cfc9b6}
  summary{font-weight:700;color:var(--g)}
  
  /* Selettore Tab Centrale ed Indipendente */
  .tab-container{display:flex;gap:10px;margin-bottom:15px}
  .tab-btn{flex:1;background:#fff;border:2px solid var(--g);color:var(--g);border-radius:10px;padding:12px;cursor:pointer;transition:all 0.2s;font-size:15px}
  .tab-btn.active{background:var(--g);color:#fff}

  /* Sezioni separate fisicamente */
  .menu-section{display:none}
  .menu-section.active{display:block}

  /* Link rapidi */
  .quick-links{margin:10px 0;background:#fff;border-radius:10px;padding:12px;border:1px solid #cfc9b6}
  .quick-links p{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--g)}
  .quick-links a{display:inline-block;margin-right:15px;color:var(--g);text-decoration:none;font-size:13px;font-weight:700;border-bottom:1px solid var(--o);padding-bottom:1px}
  .quick-links a:hover{color:var(--o)}

  /* 🖥️ Foglio del Menù */
  #sheet{display:none;background:#fff;margin-top:16px;border-radius:6px;box-shadow:0 2px 10px #0002;overflow:hidden;width:100%;max-width:500px;margin-left:auto;margin-right:auto}
  .topband{background:#073334;padding:8px 0;text-align:center}
  .topband img{width:32%;height:auto;display:block;margin:0 auto}
  .botband{background:#073334;margin-top:12px;padding-top:6px}
  .botband img{width:48%;height:auto;display:block;margin:0 auto}
  .flag{display:flex;height:5px}.flag i{flex:1}
  .flag i:nth-child(1){background:#295E28}.flag i:nth-child(2){background:#ECE6D5}.flag i:nth-child(3){background:#B60D08}
  .inner{padding:15px 22px 4px}
