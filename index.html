<style>

  --g:#073334;
  --o:#C9A227;
  --darkgold:#80600C;

*{box-sizing:border-box}

}

  display:inline-block;

  font-size:13px;

}

/* FOGLIO MENU: ANCORATO A PROPORZIONE ESATTA A4 (595px) */

#sheet{
  display:none;
  flex-direction:column;
  background:#fff;
  margin-top:16px;
  border-radius:0;
  box-shadow:0 2px 10px #0002;
  overflow:hidden;
  width:595px;
  min-height:841px;
  margin-left:auto;
  margin-right:auto;
}

.topband{
  background:var(--gband);
  padding:25px 0;
  text-align:center;
  width:100%;
  flex-shrink:0;
}

.topband img{
  width:45%;
  height:auto;
  display:block;
  margin:0 auto;
  filter: none !important;
}

.botband{
  background:var(--gband);
  margin-top:auto;
  padding-top:15px;
  width:100%;
  flex-shrink:0;
}

.botband img{
  width:55%;
  height:auto;
  display:block;
  margin:0 auto;
  filter:brightness(0) saturate(100%)
         invert(35%) sepia(76%) saturate(600%)
         hue-rotate(8deg) brightness(85%) contrast(95%);
}

.flag{
  display:flex;
  height:8px;
  width:100%;
}

.flag i{flex:1}
.flag i:nth-child(1){background:#295E28}
.flag i:nth-child(2){background:#ECE6D5}
.flag i:nth-child(3){background:#B60D08}

/* AREA TESTO */

.inner{
  padding:30px 45px 20px;
  flex:1;
  min-height:0;
}

.title{
  text-align:center;
  color:var(--g);
  font-size:34px;
  font-weight:400;
  font-family:'Quicksand',sans-serif;

}

.sub{

  color:var(--o);
  letter-spacing:.3em;

  font-weight:700;

}

.day{

  font-size:24px;
  font-weight:400;
  font-family:'Quicksand',sans-serif;
  margin:8px 0 10px;
}

/* PIATTI */

.dish-wrapper{
  padding:6px 0;
  border-bottom:1px solid #e8e8e8;
}

.dish-wrapper:last-of-type{
  border-bottom:none;
}

.dish{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  padding:3px 0;
  font-size:14.5px;
  line-height:1.4;
  font-family:'Quicksand',sans-serif;
}

.dish .n{
  outline:none;
  text-align:left;
  font-weight:400;
  font-family:'Quicksand',sans-serif;
  flex:1;
  min-width:0;
  overflow-wrap:anywhere;
}

.dish .p{
  font-weight:700;
  color:var(--g);
  outline:none;
  white-space:nowrap;
  text-align:right;
  font-family:'Quicksand',sans-serif;
  flex-shrink:0;
}

.desc{
  font-size:11px;
  color:#666;
  font-style:italic;
  margin-top:2px;
  text-align:left;
  outline:none;
  font-family:'Quicksand',sans-serif;
  line-height:1.35;
}

/* CATEGORIE */

.category-title{
  color:var(--darkgold);
  font-size:15px;
  font-weight:700;
  margin:14px 0 6px;
  border-bottom:1px dashed var(--o);
  padding-bottom:4px;
  text-transform:uppercase;
  font-family:'Quicksand',sans-serif;
  text-align:center;
  line-height:1.2;
}

.hint{
  font-size:12px;
  color:#777;
  text-align:center;
  margin-top:8px;
}

<main>

  <label>Seleziona Cosa Vuoi Creare:</label>

  <div class="tab-container">
    <button class="tab-btn active" id="tabMittag">1. Mittagstisch</button>
    <button class="tab-btn" id="tabEmpf">2. Empfehlungskarte</button>
  </div>

  <div class="quick-links">

    <a href="https://trattoria-pizzeria-krone.de/home#a9be7e1c-5c87-4fd2-88f6-b17fd602523c" target="_blank">Apri Mittagstisch</a>
    <a href="https://trattoria-pizzeria-krone.de/home#03ce3203-1647-403b-8655-5e0b8d18a3a7" target="_blank">Apri Empfehlungskarte</a>

  <!-- MITTAGSTISCH -->

  <div id="sectionMittag" class="menu-section active">

    <label for="urlMittag">Link della pagina pranzo</label>

    <input id="urlEmpf" type="url" value="https://trattoria-pizzeria-krone.de/home#03ce3203-1647-403b-8655-5e0b8d18a3a7">

    <button class="main" id="goEmpf">Crea Menù Empfehlungskarte</button>

  <div id="status"></div>

  <!-- FOGLIO MENU -->

  <div id="sheet">

    <div class="topband">

      <div class="title" id="sheetTitle">Mittagstisch</div>

    </div>

    <div class="botband" id="sheetBotBand">

    <textarea id="paste" rows="8" placeholder="Incolla il testo del menù copiato dal sito..."></textarea>
    <button class="main" id="usePaste">Usa il testo incollato</button>
  </details>

</main>

<script>
const DAYS = [
  "Montag","Dienstag","Mittwoch","Donnerstag",
  "Freitag","Samstag","Sonntag"
];

const PRICE_REGEX = /^\s*(?:€\s*)?(\d{1,3}(?:[.,]\d{1,2})?)\s*(?:€|EUR)?\s*$/;

const CATEGORIES = [
  "vorspeisen",
  "hauptgerichte",
  "getränke",
  "desserts"
];

let selectedMenuType = "mittag";
let currentParsedDishes = [];

/* PARSER MITTAGSTISCH */

function parseMittagstisch(text, day){

  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const daysLow = DAYS.map(d => d.toLowerCase());

  for(let i=0;i<lines.length;i++){

    if(lines[i].toLowerCase() !== day.toLowerCase()) continue;

    const dishes = [];
    let buf = [];

    for(let j=i+1;j<lines.length;j++){

      const x = lines[j];

      if(daysLow.includes(x.toLowerCase())) break;

      const m = x.match(PRICE_REGEX);

      if(m){

        if(buf.length){
          dishes.push([buf.slice(-2).join(" "),m[1]]);
        }

        buf = [];

      }else{

        buf.push(x);

        if(dishes.length && buf.length > 3) break;
      }
    }

    if(dishes.length) return dishes;
  }

  return [];
}

/* ESTRAZIONE PREZZI */

function extractCleanPrice(line){

  const cleaned = line.replace(/€/g,"").replace(/EUR/g,"").trim();

  const match = cleaned.match(/^(\d{1,3}[.,]\d{2})$|^(\d{1,3})$/);

  return match ? (match[1] || match[2]) : null;
}

/* PARSER EMPFEHLUNGSKARTE */

function parseEmpfehlungskarte(text){

  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const dishes = [];

  let currentCategory = "";

  const daysLow = DAYS.map(d => d.toLowerCase());

  let mittagStartIdx = -1;
  let mittagEndIdx = -1;

  for(let i=0;i<lines.length;i++){

    const lineLow = lines[i].toLowerCase();

    if(daysLow.includes(lineLow)){

      if(mittagStartIdx === -1){
        mittagStartIdx = i;
      }

      mittagEndIdx = i;
    }
  }

  let rangeToSkipStart = -1;
  let rangeToSkipEnd = -1;

  if(mittagStartIdx !== -1){

    rangeToSkipStart = mittagStartIdx;
    rangeToSkipEnd = lines.length;

    for(let k=mittagEndIdx+1;k<lines.length;k++){

      if(CATEGORIES.includes(lines[k].toLowerCase())){
        rangeToSkipEnd = k;
        break;
      }
    }
  }

  for(let i=0;i<lines.length;i++){

    if(i>=rangeToSkipStart && i<rangeToSkipEnd){
      continue;
    }

    const line = lines[i];
    const lineLow = line.toLowerCase();

    if(CATEGORIES.includes(lineLow)){
      currentCategory = line;
      continue;
    }

    const priceVal = extractCleanPrice(line);

    if(priceVal){

      let name = "";
      let desc = "";

      if(i-1>=0){

        name = lines[i-1];

        if(
          CATEGORIES.includes(name.toLowerCase()) ||
          daysLow.includes(name.toLowerCase())
        ){
          name = "Specialità dello Chef";
        }
      }

      if(i+1<lines.length){

        const nextLine = lines[i+1];

        if(
          !extractCleanPrice(nextLine) &&
          !CATEGORIES.includes(nextLine.toLowerCase()) &&
          !daysLow.includes(nextLine.toLowerCase())
        ){
          desc = nextLine;
        }
      }

      dishes.push({
        category:currentCategory || "Empfehlungen",
        name:name,
        price:priceVal,
        desc:desc
      });
    }
  }

  return dishes;
}

/* INIZIALIZZAZIONE UI */

if(typeof document !== "undefined"){

  const $ = id => document.getElementById(id);

  const selectDay = $("dayMittag");

  selectDay.innerHTML = "";

  const todayDe = new Date().toLocaleDateString(
    "de-DE",
    {
      weekday:"long",
      timeZone:"Europe/Berlin"
    }
  );

  DAYS.forEach(d => {

    const o = document.createElement("option");

    o.value = d;
    o.textContent = d;

    selectDay.appendChild(o);
  });

  selectDay.value = DAYS.slice(0,5).includes(todayDe)
    ? todayDe
    : "Montag";

  const status = (t,err) => {

    $("status").textContent = t;
    $("status").className = err ? "err" : "";
  };

  /* CAMBIO TAB */

  $("tabMittag").onclick = () => {

    selectedMenuType = "mittag";

    $("tabMittag").classList.add("active");
    $("tabEmpf").classList.remove("active");

    $("sectionMittag").classList.add("active");
    $("sectionEmpf").classList.remove("active");

    $("mainHeaderTitle").textContent = "Mittagstisch";
    $("sheetTitle").textContent = "Mittagstisch";
    $("sheetSubtitle").textContent = "TAGESGERICHTE";

    status("");
  };

  $("tabEmpf").onclick = () => {

    selectedMenuType = "empfehlung";

    $("tabEmpf").classList.add("active");
    $("tabMittag").classList.remove("active");

    $("sectionEmpf").classList.add("active");
    $("sectionMittag").classList.remove("active");

    $("mainHeaderTitle").textContent = "Empfehlungskarte";
    $("sheetTitle").textContent = "Empfehlungskarte";
    $("sheetSubtitle").textContent = "EMPFEHLUNGEN";

    status("");
  };

  /* VISUALIZZAZIONE ANTEPRIMA MITTAGSTISCH */

  function renderMittag(day,dishes){

    currentParsedDishes = dishes;
    $("sheetDay").style.display = "block";
    $("sheetDay").textContent = day;

    $("sheetBotBand").style.background = "";
    $("sheetBotImg").style.display = "block";

    $("dishes").innerHTML = "";

    dishes.forEach(([n,p]) => {

      const row = document.createElement("div");
      row.className = "dish";

      row.innerHTML =
        '<span class="n" contenteditable="true"></span>' +
        '<span class="p" contenteditable="true"></span>';

      row.querySelector(".n").textContent = n;
      row.querySelector(".p").textContent = p + " €";

      $("dishes").appendChild(row);
    });

    $("sheet").style.display = "flex";
    $("actions").style.display = "flex";
    $("hint").style.display = "block";

    status("Generato: " + dishes.length + " piatti per " + day + ".");
    $("sheet").scrollIntoView({behavior:"smooth"});
  }

  /* VISUALIZZAZIONE ANTEPRIMA EMPFEHLUNGSKARTE */

  function renderEmpfehlung(dishes){

    currentParsedDishes = dishes;
    $("sheetDay").style.display = "none";

    $("sheetBotBand").style.background = "transparent";
    $("sheetBotImg").style.display = "none";

    const container = $("dishes");
    container.innerHTML = "";

    let lastCat = "";

    dishes.forEach(dish => {

      if(
        dish.category &&
        dish.category !== lastCat &&
        dish.category.toLowerCase() !== "empfehlungen"
      ){

        const catHeader = document.createElement("div");
        catHeader.className = "category-title";
        catHeader.textContent = dish.category;
        container.appendChild(catHeader);
        lastCat = dish.category;
      }

      const wrapper = document.createElement("div");
      wrapper.className = "dish-wrapper";

      const descHtml = dish.desc
        ? `<div class="desc" contenteditable="true">${dish.desc}</div>`
        : "";

      wrapper.innerHTML = `
        <div class="dish">
          <span class="n" contenteditable="true">${dish.name}</span>
          <span class="p" contenteditable="true">${dish.price} €</span>
        </div>
        ${descHtml}
      `;

      container.appendChild(wrapper);
    });

    $("sheet").style.display = "flex";
    $("actions").style.display = "flex";
    $("hint").style.display = "block";

    status("Generato: " + dishes.length + " elementi in una singola pagina.");
    $("sheet").scrollIntoView({behavior:"smooth"});
  }

  /* LETTURA SITO MITTAGSTISCH */

  $("goMittag").onclick = async () => {

    const day = $("dayMittag").value;
    status("Lettura dei dati Mittagstisch...");

    try{

      const targetUrl = $("urlMittag").value.trim();
      const r = await fetch("/api/menu?url=" + encodeURIComponent(targetUrl));
      const j = await r.json();

      if(j.error) throw new Error(j.error);

      const dishes = parseMittagstisch(j.text,day);

      if(!dishes.length){
        status("Nessun piatto per " + day + " trovato sul sito.",true);
        return;
      }

      renderMittag(day,dishes);

    }catch(e){
      status("Errore: " + e.message,true);
    }
  };

  /* LETTURA SITO EMPFEHLUNGSKARTE */

  $("goEmpf").onclick = async () => {

    status("Lettura dei dati Empfehlungskarte...");

    try{

      const targetUrl = $("urlEmpf").value.trim();
      const r = await fetch("/api/menu?url=" + encodeURIComponent(targetUrl));
      const j = await r.json();

      if(j.error) throw new Error(j.error);

      const dishes = parseEmpfehlungskarte(j.text);

      if(!dishes.length){
        status("Nessun piatto trovato.",true);
        return;
      }

      renderEmpfehlung(dishes);

    }catch(e){
      status("Errore: " + e.message,true);
    }
  };

  /* TESTO INCOLLATO MANUALMENTE */

  $("usePaste").onclick = () => {

    const pasteContent = $("paste").value;

    if(selectedMenuType === "mittag"){

      const day = $("dayMittag").value;
      const dishes = parseMittagstisch(pasteContent,day);

      if(!dishes.length){
        status("Nessun piatto Mittagstisch nel testo.",true);
        return;
      }

      renderMittag(day,dishes);

    }else{

      const dishes = parseEmpfehlungskarte(pasteContent);

      if(!dishes.length){
        status("Nessun piatto speciale nel testo.",true);
        return;
      }

      renderEmpfehlung(dishes);
    }
  };

  /* SALVATAGGIO FILE */

  async function saveFile(blob,name){

    const file = new File([blob], name, {type:blob.type});

    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:name});
        return;
      }catch(e){
        if(e.name === "AbortError") return;
      }
    }

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  const stamp = () => new Date().toISOString().slice(0,10);

  /* ESPORTAZIONE FOTO */

  $("photo").onclick = async () => {

    status("Generazione dell'immagine...");

    try{

      await document.fonts.ready;
      window.scrollTo(0, 0);

      const isEmpf = $("sheetTitle").textContent.toLowerCase().includes("empfehlung");
      if (isEmpf) {
        $("sheetBotBand").style.background = "transparent";
        $("sheetBotImg").style.display = "none";
      }

      const canvas = await html2canvas($("sheet"),{
        useCORS: true,
        backgroundColor: "#ffffff",
        scale: 2,
        scrollY: 0
      });

      canvas.toBlob(async blob => {
        const titleName = selectedMenuType === "mittag" ? "Mittagstisch" : "Empfehlungskarte";
        await saveFile(blob, titleName + "_" + stamp() + ".png");
        status("Immagine salvata!");
      },"image/png");

    }catch(e){
      status("Errore: " + e.message,true);
    }
  };

  /* GENERAZIONE PDF: LARGHEZZA PIENA BORDO A BORDO A4 (595.28 pt) */

  $("pdf").onclick = async () => {

    status("Generazione del PDF a larghezza totale nativa...");

    try{

      await document.fonts.ready;
      window.scrollTo(0, 0);

      const isEmpf = selectedMenuType === "empfehlung";
      const originalBotBackground = $("sheetBotBand").style.background;
      const originalBotImgDisplay = $("sheetBotImg").style.display;

      if (isEmpf) {
        $("sheetBotBand").style.background = "transparent";
        $("sheetBotImg").style.display = "none";
      }

      const canvas = await html2canvas($("sheet"), {
        useCORS: true,
        backgroundColor: "#ffffff",
        scale: 3,
        scrollY: 0
      });

      if (isEmpf) {
        $("sheetBotBand").style.background = originalBotBackground;
        $("sheetBotImg").style.display = originalBotImgDisplay;
      }

      const { PDFDocument } = PDFLib;
      const pdfDoc = await PDFDocument.create();

      const pageW = 595.28;
      const pageH = 841.89;
      const page = pdfDoc.addPage([pageW, pageH]);

      const imgData = canvas.toDataURL("image/png");
      const embeddedImg = await pdfDoc.embedPng(imgData);

      // Copre ESATTAMENTE i 595.28 punti di larghezza della pagina A4 (0 margini laterali)
      const finalW = pageW;
      let finalH = (canvas.height * finalW) / canvas.width;

      // Margine inferiore millimetrico e sicuro (30 punti) per mantenere visibile la bandiera italiana sul fondo
      const bottomMargin = 30;
      const availableH = pageH - bottomMargin;

      if (finalH > availableH) {
        finalH = availableH;
      }

      const xPos = 0; // Nessuno spazio a sinistra o a destra
      const yPos = pageH - finalH;

      page.drawImage(embeddedImg, {
        x: xPos,
        y: yPos,
        width: finalW,
        height: finalH
      });

      const pdfBytes = await pdfDoc.save();

      await saveFile(
        new Blob([pdfBytes], { type: "application/pdf" }),
        (isEmpf ? "Empfehlungskarte" : "Mittagstisch") + "_" + stamp() + ".pdf"
      );

      status("PDF generato a larghezza totale nativa con successo!");

    }catch(e){
      status("Errore PDF: " + e.message, true);
    }
  };

}
</script>
