<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👑 Krone Mittagstisch Generator</title>
  <style>
    :root {
      --gold: #D4AF37;
      --dark: #2C3E50;
      --light-bg: #F9F9F9;
      --border: #E5E7EB;
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
      color: var(--dark);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      background: white;
      max-width: 600px;
      width: 100%;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--gold);
      padding-bottom: 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .header p {
      margin: 5px 0 0 0;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #7F8C8D;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--gold);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #C29B30;
    }

    #status {
      text-align: center;
      font-style: italic;
      color: #7F8C8D;
      margin: 15px 0;
    }

    /* 🍽️ Stile Elegante del Menù Risultato */
    .menu-box {
      margin-top: 30px;
      padding: 25px;
      border: 1px solid var(--gold);
      background-color: var(--light-bg);
      border-radius: 8px;
    }

    .menu-day-title {
      text-align: center;
      font-size: 22px;
      color: var(--gold);
      margin-top: 0;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: bold;
    }

    .dish-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .dish-row:last-child {
      border-bottom: none;
    }

    .dish-name {
      font-weight: bold;
      font-size: 14px;
      padding-right: 15px;
      color: var(--dark);
    }

    .dish-price {
      font-weight: bold;
      font-size: 14px;
      color: var(--gold);
      white-space: nowrap;
    }

    .footer-decor {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #95A5A6;
      border-top: 1px dashed var(--gold);
      padding-top: 15px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>👑 TRATTORIA PIZZERIA KRONE</h1>
    <p>Mittagstisch • Menù del Giorno</p>
  </div>

  <div class="form-group">
    <label for="url">URL della pagina del menù:</label>
    <input type="text" id="url" value="https://trattoria-pizzeria-krone.de/home#a9be7e1c-5c87-4fd2-88f6-b17fd602523c">
  </div>

  <div class="form-group">

    <select id="day">
      <option value="Montag">Lunedì (Montag)</option>

      <option value="Mittwoch">Mercoledì (Mittwoch)</option>
      <option value="Donnerstag">Giovedì (Donnerstag)</option>
      <option value="Freitag">Venerdì (Freitag)</option>
      <option value="Samstag">Sabato (Samstag)</option>
      <option value="Sonntag">Domenica (Sonntag)</option>
    </select>
  </div>

  <button id="go">Genera Menù Elegante</button>

  <div id="status"></div>

  <!-- Il Menù generato apparirà qui -->
  <div id="result-container" style="display: none;">
    <div class="menu-box" id="menu-box">
      <h2 class="menu-day-title" id="menu-day">MONTAG</h2>
      <div id="dishes-list"></div>
      <div class="footer-decor">
        Pizzeria & Trattoria Krone seit 2010 🇮🇹
      </div>
    </div>
  </div>
</div>
