<style>

  *{box-sizing:border-box}

  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 16px;cursor:pointer}
  .main{background:var(--g);color:#fff;width:100%;margin-top:14px;font-size:17px}

  summary{font-weight:700;color:var(--g)}
  
  /* 🖥️ Foglio del Menù (Cosa vedi a schermo) */
  #sheet{display:none;background:#fff;margin-top:16px;border-radius:6px;box-shadow:0 2px 10px #0002;overflow:hidden;width:100%;max-width:500px;margin-left:auto;margin-right:auto}
  .topband{background:#073334;padding:14px 0;text-align:center}
  .topband img{width:46%;height:auto;display:block;margin:0 auto}
  .botband{background:#073334;margin-top:18px;padding-top:12px}
  .botband img{width:68%;height:auto;display:block;margin:0 auto}
  .flag{display:flex;height:7px}.flag i{flex:1}
  .flag i:nth-child(1){background:#295E28}.flag i:nth-child(2){background:#ECE6D5}.flag i:nth-child(3){background:#B60D08}
  .inner{padding:20px 22px 6px}
  
  /* ✍️ Scritte Uniformate allo Stile dei Piatti */
  .title{text-align:center;color:var(--g);font-size:34px;font-weight:400;line-height:1.1;margin:0 0 4px}
  .sub{text-align:center;color:var(--o);letter-spacing:.3em;font-size:10px;font-weight:700;padding-bottom:12px;border-bottom:1px solid var(--o);margin-bottom:14px}

  /* Piatti senza tabelle o righe visive */
  .dish{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;font-size:16px}
  .dish .n{outline:none;font-weight:400;text-align:left}
  .dish .p{font-weight:700;color:var(--g);outline:none;white-space:nowrap;text-align:right}
  .hint{font-size:12px;color:#777;text-align:center;margin-top:8px}

  @media print{
    @page{size:A4;margin:0}
    body{background:#fff}header,main>\*:not(#sheet),.hint{display:none!important}

    .inner{padding:8mm 16mm 0}.title{font-size:40px;font-weight:400}.day{font-size:28px;font-weight:400}.dish{font-size:17px;padding:12px 0}
  }
</style>

<header><b>KRONE</b><h1>Mittagstisch</h1></header>
<main>
  <label for="url">Link della pagina</label>

  <label for="day">Giorno</label>
  <select id="day"></select>
  
  <button class="main" id="go">Crea menù</button>
  <div id="status"></div>

  <!-- Foglio menù visualizzato -->
  <div id="sheet">
    <div class="topband"><img src="logo_t.png" alt=""></div>
    <div class="inner">

      <div class="day" id="sheetDay"></div>
      <div id="dishes"></div>
    </div>
    <div class="botband"><img src="foot_t.png" alt=""><div class="flag"><i></i><i></i><i></i></div></div>

  <div class="hint" id="hint" style="display:none">Puoi toccare un piatto o un prezzo per correggerlo prima di scaricare.</div>
  
  <!-- Solo Bottone Salva come Foto -->
  <div class="row" id="actions" style="display:none">
    <button class="alt" id="photo" style="width: 100%;">Salva come Foto</button>
  </div>

  <details>
    <summary>Se non legge il sito: incolla il testo</summary>
    <p style="font-size:13px;margin:8px 0">Copia dal sito il giorno con i piatti e i prezzi (il nome del giorno su una riga, poi piatto e prezzo, uno per riga) e incollalo qui.</p>
    <textarea id="paste" rows="8" placeholder="Montag&#10;Pizza mit Schinken und Salami&#10;11&#10;..."></textarea>
    <button class="main" id="usePaste">Usa il testo incollato</button>
  </details>
</main>

<script>
const DAYS = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const PRICE = /^\s*(?:€\s*)?(\d{1,3}(?:[.,]\d{1,2})?)\s*(?:€|EUR)?\s*$/;
const GREEN = "073334";

function parseDay(text, day) {
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const daysLow = DAYS.map(d => d.toLowerCase());
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].toLowerCase() !== day.toLowerCase()) continue;
    const dishes = []; let buf = [];
    for (let j = i + 1; j < lines.length; j++) {
      const x = lines[j];
      if (daysLow.includes(x.toLowerCase())) break;
      const m = x.match(PRICE);
      if (m) { if (buf.length) dishes.push([buf.slice(-2).join(" "), m[1]]); buf = []; }
      else { buf.push(x); if (dishes.length && buf.length > 3) break; }
    }
    if (dishes.length) return dishes;
  }
  return [];
}

if (typeof document !== "undefined") {
  const \$ = id => document.getElementById(id);
  const todayDe = new Date().toLocaleDateString("de-DE", { weekday: "long", timeZone: "Europe/Berlin" });
  DAYS.forEach(d => { const o = document.createElement("option"); o.textContent = d; $("day").appendChild(o); });
  $("day").value = DAYS.slice(0, 5).includes(todayDe) ? todayDe : "Montag";
  const status = (t, err) => { \$("status").textContent = t; \$("status").className = err ? "err" : ""; };
  
  // Rende visibile il foglio compilato
  function show(day, dishes) {
    $("sheetDay").textContent = day;
    $("dishes").innerHTML = "";
    dishes.forEach(([n, p]) => {
      const row = document.createElement("div"); row.className = "dish";
      row.innerHTML = '<span class="n" contenteditable="true"></span><span class="p" contenteditable="true"></span>';
      row.querySelector(".n").textContent = n;
      row.querySelector(".p").textContent = p + " €";
      $("dishes").appendChild(row);
    });
    $("sheet").style.display = "block";
    $("actions").style.display = "flex";
    $("hint").style.display = "block";
    status("Fatto: " + dishes.length + " piatti per " + day + ".");
    $("sheet").scrollIntoView({ behavior: "smooth" });
  }
  
  $("go").onclick = async () => {
    const day = $("day").value;
    status("Leggo la pagina…");
    try {
      const r = await fetch("/api/menu?url=" + encodeURIComponent($("url").value.trim()));
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      const dishes = parseDay(j.text, day);
      if (!dishes.length) {
        status("Non trovo i piatti di " + day + " nel testo della pagina.\nPuò essere che il sito non sia ancora aggiornato, oppure che carichi i testi in modo che questa app non vede. Usa 'incolla il testo' qui sotto.\n\n", true);
        return;
      }
      show(day, dishes);
    } catch (e) { status("Errore: " + e.message, true); }
  };
  
  $("usePaste").onclick = () => {
    const day = $("day").value;
    const dishes = parseDay($("paste").value, day);
    if (!dishes.length) { status("Nel testo incollato non trovo '" + day + "' seguito da piatti e prezzi.", true); return; }
    show(day, dishes);
  };
