<style>
:root{

  --o:#C9A227;
  --darkgold:#80600C;

}

*{box-sizing:border-box}

html{

  color-scheme:light;
}

body{
  margin:0;
  font-family:'Quicksand',system-ui,sans-serif;
  color:#1a1a1a;
  background:#f4f1e8;
}

header{
  background:var(--g);
  color:#fff;
  padding:18px 16px;
  text-align:center;
  border-bottom:1px solid var(--g);
}

header b{
  color:var(--o);

}

header h1{

main{

}

label{

}

input,select,textarea{

button{

}

.main{
  background:var(--g);
  color:#fff;

  margin-top:14px;

}

.main:hover{

}

.alt{

}

.row{

.row button{flex:1}

#status{

}

#status.err{color:#a02020}

details{
  margin-top:16px;

summary{

.tab-container{

.tab-btn{

/* FOGLIO MENU */

#sheet{
  display:none;
  flex-direction:column;
  min-height:720px;
  background:#fff;
  margin-top:16px;
  border-radius:6px;
  box-shadow:0 2px 10px #0002;

  width:100%;
  max-width:500px;
  margin-left:auto;
  margin-right:auto;
}

.topband{
  background:var(--gband);
  padding:13px 0;
  text-align:center;
  width:100%;
  flex-shrink:0;
}

.topband img{
  width:43%;
  height:auto;
  display:block;
  margin:0 auto;
  /* Converte l'immagine del logo esattamente nel colore oro della variabile --o (#C9A227) */
  filter: brightness(0) saturate(100%) invert(67%) sepia(48%) saturate(542%) hue-rotate(5deg) brightness(95%) contrast(88%);

  background:var(--gband);
  margin-top:auto;
  padding-top:12px;
  width:100%;
  flex-shrink:0;
}

.botband img{
  width:60%;
  height:auto;
  display:block;
  margin:0 auto;
  filter:brightness(0) saturate(100%)

.flag{

.flag i:nth-child(1){background:#295E28}

/* AREA TESTO */

/* CATEGORIE */

.empf-pdf-compact .botband{

    margin:0;

  #sheet{

</style>

  </div>

  <!-- MITTAGSTISCH -->

  <div id="sectionMittag" class="menu-section active">

    <label for="urlMittag">Link della pagina pranzo</label>
    <input id="urlMittag" type="url" value="https://trattoria-pizzeria-krone.de/home#a9be7e1c-5c87-4fd2-88f6-b17fd602523c">

    <label for="urlEmpf">Link della pagina raccomandazioni</label>
    <input id="urlEmpf" type="url" value="https://trattoria-pizzeria-krone.de/home#03ce3203-1647-403b-8655-5e0b8d18a3a7">

    <button class="main" id="goEmpf">Crea Menù Empfehlungskarte</button>
  </div>

  <!-- FOGLIO MENU -->

    <div class="topband">

    <textarea id="paste" rows="8" placeholder="Incolla il testo del menù copiato dal sito..."></textarea>
    <button class="main" id="usePaste">Usa il testo incollato</button>
  </details>

</main>

<script>
const DAYS = [
  "Montag","Dienstag","Mittwoch","Donnerstag",
  "Freitag","Samstag","Sonntag"
];

const PRICE_REGEX = /^\s*(?:€\s*)?(\d{1,3}(?:[.,]\d{1,2})?)\s*(?:€|EUR)?\s*$/;

const CATEGORIES = [
  "vorspeisen",
  "hauptgerichte",
  "getränke",
  "desserts"
];

let selectedMenuType = "mittag";

/* PARSER MITTAGSTISCH */

function parseMittagstisch(text, day){

  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const daysLow = DAYS.map(d => d.toLowerCase());

  for(let i=0;i<lines.length;i++){

    if(lines[i].toLowerCase() !== day.toLowerCase()) continue;

    const dishes = [];
    let buf = [];

    for(let j=i+1;j<lines.length;j++){

      const x = lines[j];

      if(daysLow.includes(x.toLowerCase())) break;

      const m = x.match(PRICE_REGEX);

      if(m){

        if(buf.length){
          dishes.push([buf.slice(-2).join(" "),m[1]]);
        }

        buf = [];

      }else{

        buf.push(x);

        if(dishes.length && buf.length > 3) break;
      }
    }

    if(dishes.length) return dishes;
  }

  return [];
}

/* ESTRAZIONE PREZZI */

function extractCleanPrice(line){

  const cleaned = line.replace(/€/g,"").replace(/EUR/g,"").trim();

  const match = cleaned.match(/^(\d{1,3}[.,]\d{2})$|^(\d{1,3})$/);

  return match ? (match[1] || match[2]) : null;
}

/* PARSER EMPFEHLUNGSKARTE */

function parseEmpfehlungskarte(text){

  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const dishes = [];

  let currentCategory = "";

  const daysLow = DAYS.map(d => d.toLowerCase());

  let mittagStartIdx = -1;
  let mittagEndIdx = -1;

  for(let i=0;i<lines.length;i++){

    const lineLow = lines[i].toLowerCase();

    if(daysLow.includes(lineLow)){

      if(mittagStartIdx === -1){
        mittagStartIdx = i;
      }

      mittagEndIdx = i;
    }
  }

  let rangeToSkipStart = -1;
  let rangeToSkipEnd = -1;

  if(mittagStartIdx !== -1){

    rangeToSkipStart = mittagStartIdx;
    rangeToSkipEnd = lines.length;

    for(let k=mittagEndIdx+1;k<lines.length;k++){

      if(CATEGORIES.includes(lines[k].toLowerCase())){
        rangeToSkipEnd = k;
        break;
      }
    }
  }

  for(let i=0;i<lines.length;i++){

    if(i>=rangeToSkipStart && i<rangeToSkipEnd){
      continue;
    }

    const line = lines[i];
    const lineLow = line.toLowerCase();

    if(CATEGORIES.includes(lineLow)){
      currentCategory = line;
      continue;
    }

    const priceVal = extractCleanPrice(line);

    if(priceVal){

      let name = "";
      let desc = "";

      if(i-1>=0){

        name = lines[i-1];

        if(
          CATEGORIES.includes(name.toLowerCase()) ||
          daysLow.includes(name.toLowerCase())
        ){
          name = "Specialità dello Chef";
        }
      }

      if(i+1<lines.length){

        const nextLine = lines[i+1];

        if(
          !extractCleanPrice(nextLine) &&
          !CATEGORIES.includes(nextLine.toLowerCase()) &&
          !daysLow.includes(nextLine.toLowerCase())
        ){
          desc = nextLine;
        }
      }

      dishes.push({
        category:currentCategory || "Empfehlungen",
        name:name,
        price:priceVal,
        desc:desc
      });
    }
  }

  return dishes;
}

/* INIZIALIZZAZIONE */

if(typeof document !== "undefined"){

  const $ = id => document.getElementById(id);

  const selectDay = $("dayMittag");

  selectDay.innerHTML = "";

  const todayDe = new Date().toLocaleDateString(
    "de-DE",
    {
      weekday:"long",
      timeZone:"Europe/Berlin"
    }
  );

  DAYS.forEach(d => {

    const o = document.createElement("option");

    o.value = d;
    o.textContent = d;

    selectDay.appendChild(o);
  });

  selectDay.value = DAYS.slice(0,5).includes(todayDe)
    ? todayDe
    : "Montag";

  const status = (t,err) => {

    $("status").textContent = t;
    $("status").className = err ? "err" : "";
  };

  /* CAMBIO TAB */

  $("tabMittag").onclick = () => {

    selectedMenuType = "mittag";

    $("tabMittag").classList.add("active");
    $("tabEmpf").classList.remove("active");

    $("sectionMittag").classList.add("active");
    $("sectionEmpf").classList.remove("active");

    $("mainHeaderTitle").textContent = "Mittagstisch";
    $("sheetTitle").textContent = "Mittagstisch";
    $("sheetSubtitle").textContent = "TAGESGERICHTE";

    status("");
  };

  $("tabEmpf").onclick = () => {

    selectedMenuType = "empfehlung";

    $("tabEmpf").classList.add("active");
    $("tabMittag").classList.remove("active");

    $("sectionEmpf").classList.add("active");
    $("sectionMittag").classList.remove("active");

    $("mainHeaderTitle").textContent = "Empfehlungskarte";
    $("sheetTitle").textContent = "Empfehlungskarte";
    $("sheetSubtitle").textContent = "EMPFEHLUNGEN";

    status("");
  };

  /* VISUALIZZAZIONE MITTAGSTISCH */

  function renderMittag(day,dishes){

    $("sheetDay").style.display = "block";
    $("sheetDay").textContent = day;

    $("dishes").innerHTML = "";

    dishes.forEach(([n,p]) => {

      const row = document.createElement("div");
      row.className = "dish";

      row.innerHTML =
        '<span class="n" contenteditable="true"></span>' +
        '<span class="p" contenteditable="true"></span>';

      row.querySelector(".n").textContent = n;
      row.querySelector(".p").textContent = p + " €";

      $("dishes").appendChild(row);
    });

    $("sheet").style.display = "flex";
    $("actions").style.display = "flex";
    $("hint").style.display = "block";

    status("Generato: " + dishes.length + " piatti per " + day + ".");

    $("sheet").scrollIntoView({behavior:"smooth"});
  }

  /* VISUALIZZAZIONE EMPFEHLUNGSKARTE */

  function renderEmpfehlung(dishes){

    $("sheetDay").style.display = "none";

    const container = $("dishes");

    container.innerHTML = "";

    let lastCat = "";

    dishes.forEach(dish => {

      if(
        dish.category &&
        dish.category !== lastCat &&
        dish.category.toLowerCase() !== "empfehlungen"
      ){

        const catHeader = document.createElement("div");

        catHeader.className = "category-title";
        catHeader.textContent = dish.category;

        container.appendChild(catHeader);

        lastCat = dish.category;
      }

      const wrapper = document.createElement("div");

      wrapper.className = "dish-wrapper";

      const descHtml = dish.desc
        ? `<div class="desc" contenteditable="true">${dish.desc}</div>`
        : "";

      wrapper.innerHTML = `
        <div class="dish">
          <span class="n" contenteditable="true">${dish.name}</span>
          <span class="p" contenteditable="true">${dish.price} €</span>
        </div>
        ${descHtml}
      `;

      container.appendChild(wrapper);
    });

    $("sheet").style.display = "flex";
    $("actions").style.display = "flex";
    $("hint").style.display = "block";

    status("Generato: " + dishes.length + " elementi.");

    $("sheet").scrollIntoView({behavior:"smooth"});
  }

  /* LETTURA SITO MITTAGSTISCH */

  $("goMittag").onclick = async () => {

    const day = $("dayMittag").value;

    status("Lettura dei dati Mittagstisch...");

    try{

      const targetUrl = $("urlMittag").value.trim();

      const r = await fetch("/api/menu?url=" + encodeURIComponent(targetUrl));
      const j = await r.json();

      if(j.error) throw new Error(j.error);

      const dishes = parseMittagstisch(j.text,day);

      if(!dishes.length){

        status("Nessun piatto per " + day + " trovato sul sito.",true);
        return;
      }

      renderMittag(day,dishes);

    }catch(e){

      status("Errore: " + e.message,true);
    }
  };

  /* LETTURA SITO EMPFEHLUNGSKARTE */

  $("goEmpf").onclick = async () => {

    status("Lettura dei dati Empfehlungskarte...");

    try{

      const targetUrl = $("urlEmpf").value.trim();

      const r = await fetch("/api/menu?url=" + encodeURIComponent(targetUrl));
      const j = await r.json();

      if(j.error) throw new Error(j.error);

      const dishes = parseEmpfehlungskarte(j.text);

      if(!dishes.length){

        status("Nessun piatto trovato.",true);
        return;
      }

      renderEmpfehlung(dishes);

    }catch(e){

      status("Errore: " + e.message,true);
    }
  };

  /* TESTO INCOLLATO MANUALMENTE */

  $("usePaste").onclick = () => {

    const pasteContent = $("paste").value;

    if(selectedMenuType === "mittag"){

      const day = $("dayMittag").value;
      const dishes = parseMittagstisch(pasteContent,day);

      if(!dishes.length){

        status("Nessun piatto Mittagstisch nel testo.",true);
        return;
      }

      renderMittag(day,dishes);

    }else{

      const dishes = parseEmpfehlungskarte(pasteContent);

      if(!dishes.length){

        status("Nessun piatto speciale nel testo.",true);
        return;
      }

      renderEmpfehlung(dishes);
    }
  };

  /* SALVATAGGIO FILE */

  async function saveFile(blob,name){

    const file = new File(
      [blob],
      name,
      {type:blob.type}
    );

    if(
      navigator.canShare &&
      navigator.canShare({files:[file]})
    ){

      try{

        await navigator.share({
          files:[file],
          title:name
        });

        return;

      }catch(e){

        if(e.name === "AbortError") return;
      }
    }

    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);
    a.download = name;

    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  const stamp = () => new Date().toISOString().slice(0,10);

  /* ESPORTAZIONE FOTO */

  $("photo").onclick = async () => {

    status("Generazione dell'immagine...");

    try{

      await document.fonts.ready;

      const canvas = await html2canvas($("sheet"),{
        useCORS:true,
        backgroundColor:"#ffffff",
        scale:2
      });

      canvas.toBlob(async blob => {

        const titleName = selectedMenuType === "mittag"
          ? "Mittagstisch"
          : "Empfehlungskarte";

        await saveFile(
          blob,
          titleName + "_" + stamp() + ".png"
        );

        status("Immagine salvata!");

      },"image/png");

    }catch(e){

      status("Errore: " + e.message,true);
    }
  };

  /* ESPORTAZIONE PDF: PAGINAZIONE DINAMICA SENZA CONTATORE */

  $("pdf").onclick = async () => {

    status("Generazione del PDF...");

    try{

      await document.fonts.ready;

      const {PDFDocument} = PDFLib;
      const pdfDoc = await PDFDocument.create();

      const a4Width = 595.28;
      const a4Height = 841.89;

      const titleText = selectedMenuType === "mittag"
        ? "Mittagstisch"
        : "Empfehlungskarte";

      const subtitleText = selectedMenuType === "mittag"
        ? "TAGESGERICHTE"
        : "EMPFEHLUNGEN";

      const dayText = $("sheetDay").textContent;

      const tempContainer = document.createElement("div");
      tempContainer.style.position = "absolute";
      tempContainer.style.top = "-9999px";
      tempContainer.style.left = "-9999px";
      tempContainer.style.width = "500px";
      document.body.appendChild(tempContainer);

      if (selectedMenuType === "mittag") {

        const cloneSheet = $("sheet").cloneNode(true);
        cloneSheet.style.display = "flex";
        cloneSheet.style.flexDirection = "column";
        cloneSheet.style.width = "500px";
        cloneSheet.style.minHeight = "720px";
        cloneSheet.style.height = "720px";
        cloneSheet.style.margin = "0";
        cloneSheet.style.boxShadow = "none";

        tempContainer.appendChild(cloneSheet);

        const dishesDiv = cloneSheet.querySelector("#dishes");
        dishesDiv.innerHTML = "";
        cloneSheet.querySelector("#sheetTitle").textContent = titleText;
        cloneSheet.querySelector("#sheetSubtitle").textContent = subtitleText;
        cloneSheet.querySelector("#sheetDay").style.display = "block";
        cloneSheet.querySelector("#sheetDay").textContent = dayText;

        Array.from($("dishes").children).forEach(el => {
          dishesDiv.appendChild(el.cloneNode(true));
        });

        await new Promise(resolve => requestAnimationFrame(resolve));

        const canvas = await html2canvas(cloneSheet, {
          useCORS: true,
          backgroundColor: "#ffffff",
          scale: 2
        });

        const imgData = canvas.toDataURL("image/png");
        const page = pdfDoc.addPage([a4Width, a4Height]);
        const pngImage = await pdfDoc.embedPng(imgData);

        const margin = 12;
        const maxWidth = a4Width - margin * 2;
        const maxHeight = a4Height - margin * 2;

        let finalWidth = maxWidth;
        let finalHeight = canvas.height * finalWidth / canvas.width;

        if (finalHeight > maxHeight) {
          finalHeight = maxHeight;
          finalWidth = canvas.width * finalHeight / canvas.height;
        }

        const xPos = (a4Width - finalWidth) / 2;
        const yPos = (a4Height - finalHeight) / 2;

        page.drawImage(pngImage, {
          x: xPos,
          y: yPos,
          width: finalWidth,
          height: finalHeight
        });

      } else {

        const items = Array.from($("dishes").children);
        
        const baseSheet = $("sheet").cloneNode(true);
        baseSheet.style.display = "flex";
        baseSheet.style.flexDirection = "column";
        baseSheet.style.width = "500px";
        baseSheet.style.minHeight = "720px";
        baseSheet.style.height = "720px";
        baseSheet.style.margin = "0";
        baseSheet.style.boxShadow = "none";
        baseSheet.classList.add("empf-pdf-compact");

        const baseDishes = baseSheet.querySelector("#dishes");
        baseDishes.innerHTML = "";
        baseSheet.querySelector("#sheetTitle").textContent = titleText;
        baseSheet.querySelector("#sheetSubtitle").textContent = subtitleText;
        baseSheet.querySelector("#sheetDay").style.display = "none";

        tempContainer.appendChild(baseSheet);
        await new Promise(resolve => requestAnimationFrame(resolve));

        const innerContainer = baseSheet.querySelector(".inner");
        const headerSpace = baseSheet.querySelector("#sheetTitle").offsetHeight + 
                            baseSheet.querySelector("#sheetSubtitle").offsetHeight + 20;
        const maxContentHeight = innerContainer.clientHeight - headerSpace;

        tempContainer.removeChild(baseSheet);

        let currentPageItems = [];
        let currentHeight = 0;
        const pages = [];

        for (let i = 0; i < items.length; i++) {
          const cloneItem = items[i].cloneNode(true);
          
          const measureDiv = document.createElement("div");
          measureDiv.style.width = "450px";
          measureDiv.appendChild(cloneItem);
          tempContainer.appendChild(measureDiv);
          const itemHeight = measureDiv.offsetHeight + 10;
          tempContainer.removeChild(measureDiv);

          if (currentHeight + itemHeight > maxContentHeight && currentPageItems.length > 0) {
            pages.push(currentPageItems);
            currentPageItems = [items[i]];
            currentHeight = itemHeight;
          } else {
            currentPageItems.push(items[i]);
            currentHeight += itemHeight;
          }
        }

        if (currentPageItems.length > 0) {
          pages.push(currentPageItems);
        }

        for (let p = 0; p < pages.length; p++) {
          const pageSheet = $("sheet").cloneNode(true);
          pageSheet.style.display = "flex";
          pageSheet.style.flexDirection = "column";
          pageSheet.style.width = "500px";
          pageSheet.style.minHeight = "720px";
          pageSheet.style.height = "720px";
          pageSheet.style.margin = "0";
          pageSheet.style.boxShadow = "none";
          pageSheet.classList.add("empf-pdf-compact");

          const dishesDiv = pageSheet.querySelector("#dishes");
          dishesDiv.innerHTML = "";

          pageSheet.querySelector("#sheetTitle").textContent = titleText;
          // Imposta il sottotitolo fisso senza contatore di pagina (1/x)
          pageSheet.querySelector("#sheetSubtitle").textContent = subtitleText;
          pageSheet.querySelector("#sheetDay").style.display = "none";

          pages[p].forEach(el => {
            dishesDiv.appendChild(el.cloneNode(true));
          });

          tempContainer.appendChild(pageSheet);
          await new Promise(resolve => requestAnimationFrame(resolve));

          const canvas = await html2canvas(pageSheet, {
            useCORS: true,
            backgroundColor: "#ffffff",
            scale: 2
          });

          tempContainer.removeChild(pageSheet);

          const imgData = canvas.toDataURL("image/png");
          const page = pdfDoc.addPage([a4Width, a4Height]);
          const pngImage = await pdfDoc.embedPng(imgData);

          const margin = 12;
          const maxWidth = a4Width - margin * 2;
          const maxHeight = a4Height - margin * 2;

          let finalWidth = maxWidth;
          let finalHeight = canvas.height * finalWidth / canvas.width;

          if (finalHeight > maxHeight) {
            finalHeight = maxHeight;
            finalWidth = canvas.width * finalHeight / canvas.height;
          }

          const xPos = (a4Width - finalWidth) / 2;
          const yPos = (a4Height - finalHeight) / 2;

          page.drawImage(pngImage, {
            x: xPos,
            y: yPos,
            width: finalWidth,
            height: finalHeight
          });
        }
      }

      tempContainer.remove();

      const pdfBytes = await pdfDoc.save();

      await saveFile(
        new Blob([pdfBytes], {type: "application/pdf"}),
        titleText + "_" + stamp() + ".pdf"
      );

      status("PDF salvato con successo!");

    }catch(e){

      status("Errore: " + e.message, true);
    }
  };

}
</script>
